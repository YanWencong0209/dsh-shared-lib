# dsh-shared-lib：共享库（工具 / 开发环境 / 技能）
# 本 bundle 只挂载自己的行。记忆后端（meow-memory / dsh-mnemon）作为独立 bundle 安装，
# 由各自的 patch 负责挂载——不要把它们的 insert 行复制到这里。
- insert:
    - id: shared-lib
      name: 'dsh-shared-lib'
      config:
        root: /root/shared
        linkDir: /usr/local/bin
        # 前置拦截 pip install / npm install -g（有项目清单时放行）；关掉就退化成纯引导
        intercept: true
        # 装了 -g 也不看项目清单，永远拦（想让全局安装也强制进共享库时打开）
        # npmGlobalIgnoreManifest: true
        # 项目清单白名单，命中即视为「项目内依赖」放行
        # manifests:
        #   - package.json
        #   - requirements.txt

# ── 记忆后端（独立安装，不在此插行）──
#
# 为什么不在本 patch 里插 meow-memory：
#   本 bundle 用 link: 方式安装，pnpm 不会把它的 dependencies 装进 profile 的 node_modules。
#   若这里写 `name: 'meow-memory'`，Loader 从 profile 根解析不到该包，会得到
#   ERR_MODULE_NOT_FOUND，使整个 bundle 判为 application: failed（0.6.0 实测）。
#
# 启用记忆（二选一，均在装完本 bundle 之后）：
#   1) plugin_manager(action:"install_bundle", target:"meow-memory")
#      —— 上游自带 bundle patch，会挂自己的行并带齐依赖；七层 SQLite 跨会话记忆。
#      数据家建议指向共享库：在 profile 覆盖里给 meow-memory 行加
#      homeDir: /root/shared/state/memory-home
#   2) plugin_manager(action:"install_bundle", target:"dsh-mnemon")
#      —— Mnemon 记忆空间；其 patch 含分组与 !!js 表达式，禁止复制插行（上游 issue #470）。
#
# 两套同开会让首轮上下文注入翻倍。用 shared memory status / shared_lib(action:"memory")
# 看 declared / active / data 三层状态，只有 memory_* 工具可见才算脑子在跑。
