# dsh-shared-lib：共享库（工具 / 开发环境 / 技能）+ 记忆后端
- insert:
    - id: shared-lib
      name: 'dsh-shared-lib'
      config:
        root: /root/shared
        linkDir: /usr/local/bin
        # 前置拦截 pip install / npm install -g（有项目清单时放行）；关掉就退化成纯引导
        intercept: true
        # 装了 -g 也不看项目清单，永远拦（想让全局安装也强制进共享库时打开）
        # npmGlobalIgnoreManifest: true
        # 项目清单白名单，命中即视为「项目内依赖」放行
        # manifests:
        #   - package.json
        #   - requirements.txt

    # ── 记忆后端 1：meow-memory（https://github.com/Phant0Meow/dsh-meow-memory，MIT）
    # 七层 SQLite 跨会话记忆：soul/user/project/fact/lesson/topic/rules，
    # 首轮快照注入、关键词命中、反思、dream 空闲整理。包由本 bundle 依赖带入 profile。
    # 注意：不要再单独启用 meow-memory 自己的 bundle，否则条目 id 重复。
    # 常用配置项见其 docs/配置参考.md：enabled / projectDir / homeDir / hitTopK / promptLang / dream.*
    - id: meow-memory
      name: 'meow-memory'
      config:
        # 脑子的数据家迁进共享库（日志/window-index/prompts 覆盖层都落这里，
        # 首次挂载自动从 ~/.dsh-meow 迁移旧内容）。记忆库本体仍按工作区 .dsh-meow 隔离，属上游设计。
        # 改了 shared-lib 的 root 时，这里要一起改。
        homeDir: /root/shared/state/memory-home
        # promptLang: zh
        # dream:
        #   enabled: true
        #   idleMinutes: 180

    # ── 记忆后端 2：dsh-mnemon（Mnemon 记忆系统，上游 github.com/mnemon-dev/mnemon，Apache-2.0；
    # 集成包 dsh-mnemon 为 MIT）——刻意【不】在这里插行。
    # 依据：dsh-mnemon 自带完整 bundle patch（分组 + !!js 表达式），其文档明确禁止把它的
    # insert 块复制进 profile 补丁——重复条目 id 会让 Settings 无法保存（上游 issue #470）。
    # 启用方式（二选一，装完本 bundle 之后）：
    #   1) plugin_manager(action:"install_bundle", target:"dsh-mnemon") —— 作为独立 bundle 挂载并启用；
    #   2) 保持不启用：只用 meow-memory 一套记忆，避免双注入。
    # Memory Spaces 的 Mnemon Native provider 需要 mnemon CLI：`shared memory setup-mnemon`
    # 会把它装进共享 npm prefix（本包 env/npm）并自动软链进 PATH；`shared memory status` 查看两边状态。
